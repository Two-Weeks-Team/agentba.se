<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Illustrative skincare film renderer</title>
<style>html,body{margin:0;background:#efe9de}canvas{display:block;width:360px;height:640px}</style>
<script type="module">
// Offline asset authoring only. Serve beside the preview's assets/ directory.
// Original procedural artwork: a fictional, unbranded sample, not a review.
import * as THREE from './assets/vendor/three/three.module.js';
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(720,1280); renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#eee7dc');
const camera=new THREE.PerspectiveCamera(31,720/1280,.1,100);
camera.position.set(4.2,4,8.3);camera.lookAt(0,2,0);
scene.add(new THREE.HemisphereLight(0xfffaf1,0xb8a48b,.8));
const key=new THREE.DirectionalLight(0xfff8eb,2.2);key.position.set(-3,7,4);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=6;key.shadow.camera.bottom=-4;key.shadow.normalBias=.025;
scene.add(key);const rim=new THREE.DirectionalLight(0xffffff,1.5);rim.position.set(3,5,-4);scene.add(rim);
const environment=new THREE.Scene();environment.background=new THREE.Color('#d7cabb');
for(const [x,y,z,w,h,power] of [[-3,3,2,2,6,4],[3,4,1,1,5,6],[0,6,-1,5,2,3]]){
 const softbox=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(power,power,power)}));
 softbox.position.set(x,y,z);softbox.lookAt(0,2,0);environment.add(softbox);
}
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(environment,.04).texture;
scene.environmentIntensity=.7;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#c4b398',roughness:.88}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(1.24,1.27,.18,96),new THREE.MeshStandardMaterial({color:'#e7dece',roughness:.7}));
pedestal.position.y=.09;pedestal.receiveShadow=true;pedestal.castShadow=true;scene.add(pedestal);
const product=new THREE.Group();product.position.y=.18;scene.add(product);
function lathe(points,material,parent=product){const mesh=new THREE.Mesh(new THREE.LatheGeometry(points.map(([r,y])=>new THREE.Vector2(r,y)),96),material);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;}
const glass=new THREE.MeshPhysicalMaterial({color:'#fff8e2',roughness:.085,metalness:0,transmission:1,thickness:.14,ior:1.47,transparent:true,opacity:1,side:THREE.DoubleSide});
lathe([[0,0],[.40,0],[.47,.05],[.49,.14],[.49,1.44],[.47,1.55],[.32,1.7],[.24,1.76],[.24,1.97],[.19,1.97],[.19,1.76],[.27,1.7],[.42,1.5],[.435,.15],[.39,.11],[0,.11]],glass);
const serum=new THREE.MeshPhysicalMaterial({color:'#f9c24b',roughness:.12,metalness:.05,clearcoat:1,clearcoatRoughness:.1});
lathe([[0,.12],[.4,.12],[.433,.18],[.433,1.25],[.429,1.28],[0,1.28]],serum);
const dropper=new THREE.Group();product.add(dropper);
const gold=new THREE.MeshStandardMaterial({color:'#b4a070',metalness:1,roughness:.24});
lathe([[.245,1.87],[.295,1.87],[.305,1.91],[.305,2.34],[.285,2.38],[.245,2.38]],gold,dropper);
lathe([[0,2.36],[.185,2.36],[.19,2.62],[.178,2.83],[.145,2.93],[.08,2.99],[0,3.0]],new THREE.MeshStandardMaterial({color:'#f1e7ca',roughness:.4}),dropper);
lathe([[0,.43],[.038,.44],[.047,.54],[.047,2.0],[0,2.0]],new THREE.MeshPhysicalMaterial({color:'#fff6d2',transmission:.75,roughness:.08,thickness:.05,ior:1.47}),dropper);
const bead=new THREE.Mesh(new THREE.SphereGeometry(.07,32,24),serum);product.add(bead);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.306,.009,8,96),gold);ring.rotation.x=Math.PI/2;ring.position.y=1.98;product.add(ring);
window.filmFrame=time=>{
 const phase=(time%7)/7, lift=Math.sin(Math.PI*phase)**2;
 product.rotation.y=.2*Math.sin(phase*Math.PI*2);product.rotation.z=.025*Math.sin(phase*Math.PI*2);
 dropper.position.y=1.08*lift;
 bead.position.set(0,1.35+(.37-((phase*3)%1)*.34)*lift,0);bead.scale.set(.8,1.4,.8);bead.visible=lift>.6;
 camera.position.x=4.2+.5*Math.sin(phase*Math.PI*2);camera.lookAt(0,2,0);
 renderer.render(scene,camera);
};
window.filmFrame(1.8);
// Render 105 deterministic frames at time=index/15, then encode at 30 fps.
// This produces a 3.5-second loop without relying on browser recording clocks.
</script></html>
