# pnpm 11 reads overrides and settings from here, not package.json.

overrides:
  # vite@8.2.0 declares a dependency on lightningcss ^1.33.0, which is not
  # published (latest is 1.32.0). Pinned until upstream republishes.
  vite: 8.1.5
  # Security fixes for transitive versions still retained by parent packages.
  # Keep these within their current major release until upstream ranges move.
  'nanoid@<3.3.18': 3.3.20
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'brace-expansion@<1.1.21': 1.1.21
  'dompurify@<=3.4.15': 3.4.16
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2

# Supply-chain hardening, matching the sibling repo's posture.
# Reject packages published less than a day ago; a compromised release is
# usually pulled well within that window.
minimumReleaseAge: 1440

# Postinstall scripts are denied by default; each one here is an explicit,
# reviewed decision. The three allowed ones ship prebuilt native binaries.
allowBuilds:
  core-js: false # posthog-js transitive; its postinstall only prints a donation banner
  esbuild: true # bundler behind vite/tsx
  sharp: true # next/image optimisation
  unrs-resolver: true # eslint module resolution
